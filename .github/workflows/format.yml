name: format-check

on:
    push:
        branches:
            - "master"
            - "main"
            - "release-"
        tags: "*"
    pull_request:

jobs:
    runic:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v6
            - uses: fredrikekre/runic-action@v1
              with:
                  version: "1"